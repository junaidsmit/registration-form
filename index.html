<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <big style="color:green; font-size:2rem;">411854 &emsp; &emsp;MUHAMMAD JUNAID</big>
        <br>
        <Img src="./smit.png" alt="SMIT Image">
        <h2>Saylani Online Academy</h2>
        <br>
        <form action="./registration success.html" style="width: 650px; height: 850px; background-color: lightgrey;">
            <br>
            <h3>Student Registration Form</h3>
            <label for="name">Name&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <input type="text" id="name" placeholder="Name" name="Name" required size="50" style="height: 25px;">
            <br><br>
            <label for="fname">Father's Name&nbsp;&nbsp;&nbsp;&emsp;&emsp;&emsp;</label>
            <input type="text" id="fname" placeholder="Father's Name" name="fname" required size="50"
                style="height: 25px;">
            <br><br>
            <label for="pword">Password&nbsp;&nbsp;&nbsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <input type="text" id="pword" placeholder="Password" name="pword" required minlength="8" size="50"
                style="height: 25px;">
            <br><br>
            <label for="addr">Address&nbsp;&nbsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <textarea id="addr" name="addr" rows="7" cols="48"></textarea>
            <br><br>
            <label for="Gender">Gender&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&nbsp;&nbsp;</label>
            <input type="radio" id="gender" name="Gender" value="Male" required>
            <label for="Gender">Male</label>
            <input type="radio" id="gender" name="Gender" value="Female" required>
            <label for="Gender">Female</label>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <br><br>
            <label for="Lang">&nbsp;&nbsp;Language&nbsp;&nbsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <input type="checkbox" id="lang" name="lang" value="Urdu">
            <label for="Language">Urdu</label>
            <input type="checkbox" id="lang" name="lang" value="English">
            <label for="Language">English</label>
            <input type="checkbox" id="lang" name="lang" value="Arabic">
            <label for="Language">Arabic</label>
            <input type="checkbox" id="lang" name="lang" value="Chinees">
            <label for="Language">Chinees</label>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <br><br>
            <label for="dob">DOB&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <input type="date" id="dob" name="dob" required size="50" style="height: 25px;">
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <br><br>
            <label for="email">&emsp;Email&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <input type="email" id="email" placeholder="Email Id" required name="email" size="50" style="height: 25px;">
            &emsp;&nbsp;&nbsp;
            <br><br>
            <label for="mob">&emsp;Mobile Number&emsp;&emsp;&emsp;</label>
            <input type="number" id="mob" placeholder="Mobile Number" required name="mob" size="50"
                style="height: 25px;">
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <br><br>
            <label for="city">City&emsp;&emsp;&emsp;&nbsp;&emsp;&emsp;&emsp;&emsp;</label>
            <select id="city" name="city">
                <option value="Select Your City" disabled selected>Select Your City</option>
                <option value="HYDERABAD">HYDERABAD</option>
                <option value="KARACHI">KARACHI</option>
                <option value="MIRPURKHAS">MIRPURKHAS</option>
                <option value="NAWABSHAH">NAWABSHAH</option>
                <option value="SUKKUR">SUKKUR</option>
            </select>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <br><br>
            <label for="hobi">Hobbies&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;</label>
            <select id="hobi" name="hobi" multiple size="4">
                <option value="Cricket">Cricket</option>
                <option value="Football">Football</option>
                <option value="Hockey">Hockey</option>
                <option value="Tennis">Tennis</option>
            </select>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <br><br>
            <label for="pic">Picture Upload&emsp;&emsp;&emsp;</label>
            <input type="file" id="pic" accept="IMAGE/*,pdf">
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;<br><br>
            <br>
            <input type="submit" value="Submit Form">
            <br>
        </form>
    </center>
</body>

</html>
